<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi 网络认证</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ant-primary-color: #1890ff;
            --ant-primary-color-hover: #40a9ff;
            --ant-primary-color-active: #096dd9;
            --ant-success-color: #52c41a;
            --ant-error-color: #ff4d4f;
            --ant-warning-color: #faad14;
            --ant-text-color: #262626;
            --ant-text-color-secondary: #8c8c8c;
            --ant-border-color: #d9d9d9;
            --ant-border-color-split: #f0f0f0;
            --ant-background-color: #fafafa;
            --ant-card-background: #ffffff;
            --ant-box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            --ant-box-shadow-secondary: 0 4px 12px rgba(0, 0, 0, 0.15);
            --ant-border-radius: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ant-text-color);
            position: relative;
            overflow: hidden;
        }

        /* 星空背景 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 60px 70px, #fff, transparent),
                radial-gradient(1px 1px at 50px 50px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 90px 10px, #fff, transparent),
                radial-gradient(1px 1px at 150px 120px, #fff, transparent),
                radial-gradient(1px 1px at 200px 40px, #fff, transparent),
                radial-gradient(2px 2px at 180px 90px, #fff, transparent),
                radial-gradient(1px 1px at 30px 150px, rgba(135, 206, 235, 0.8), transparent),
                radial-gradient(1px 1px at 170px 30px, rgba(255, 182, 193, 0.8), transparent);
            background-size: 200px 200px;
            background-repeat: repeat;
            opacity: 0.6;
            animation: twinkle 4s ease-in-out infinite;
            pointer-events: none;
        }

        /* 世界地图背景 */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            background-image: url('world-map.svg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.08;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Ant Design 风格容器 */
        .auth-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            transition: box-shadow 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
            position: relative;
            z-index: 1;
        }

        .auth-container:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        /* Ant Design 风格标题 */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1890ff 0%, #69c0ff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.2);
        }

        .auth-logo i {
            font-size: 28px;
            color: white;
        }

        .auth-header h1 {
            color: var(--ant-text-color);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--ant-text-color-secondary);
            font-size: 14px;
        }

        /* 设备信息卡片 - Ant Design 风格 */
        .device-info {
            background: #fafafa;
            border: 1px solid #d9d9d9;
            border-radius: var(--ant-border-radius);
            padding: 16px;
            margin-bottom: 24px;
        }

        .device-info h4 {
            color: var(--ant-text-color);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .device-info h4 i {
            margin-right: 8px;
            color: var(--ant-primary-color);
        }

        .device-info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--ant-border-color-split);
        }

        .device-info-item:last-child {
            border-bottom: none;
        }

        .device-info-label {
            color: var(--ant-text-color-secondary);
            font-size: 14px;
        }

        .device-info-value {
            color: var(--ant-text-color);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--ant-text-color);
            font-size: 14px;
            font-weight: 500;
        }

        .ant-input {
            width: 100%;
            height: 40px;
            padding: 8px 12px 8px 40px;
            border: 1px solid #d9d9d9;
            border-radius: var(--ant-border-radius);
            font-size: 14px;
            color: var(--ant-text-color);
            background-color: #fff;
            transition: all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
            outline: none;
        }

        .ant-input:hover {
            border-color: #40a9ff;
        }

        .ant-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .ant-input-prefix {
            position: relative;
            width: 100%;
        }

        .ant-input-prefix i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ant-text-color-secondary);
            z-index: 2;
            pointer-events: none;
            font-size: 14px;
        }

        .ant-btn {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: var(--ant-border-radius);
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
            outline: none;
        }

        .ant-btn-primary {
            background: #1890ff;
            color: white;
        }

        .ant-btn-primary:hover:not(:disabled) {
            background: #40a9ff;
        }

        .ant-btn-primary:active:not(:disabled) {
            background: #096dd9;
        }

        .ant-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f5f5;
            color: rgba(0, 0, 0, 0.25);
        }

        .ant-btn-loading {
            pointer-events: none;
        }

        .ant-alert {
            border-radius: var(--ant-border-radius);
            padding: 12px 16px;
            margin-top: 16px;
            border: 1px solid;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .ant-alert-success {
            background-color: #f6ffed;
            border-color: #b7eb8f;
            color: #389e0d;
        }

        .ant-alert-error {
            background-color: #fff2f0;
            border-color: #ffccc7;
            color: #cf1322;
        }

        .ant-alert-warning {
            background-color: #fffbe6;
            border-color: #ffe58f;
            color: #d46b08;
        }

        .ant-alert-info {
            background-color: #e6f7ff;
            border-color: #91d5ff;
            color: #096dd9;
        }

        .ant-alert-icon {
            margin-right: 8px;
            font-size: 16px;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 16px;
        }

        .ant-spin {
            width: 20px;
            height: 20px;
            border: 2px solid var(--ant-border-color-split);
            border-top: 2px solid var(--ant-primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--ant-text-color-secondary);
            font-size: 14px;
        }

        /* 调试信息 - Ant Design 风格 */
        .debug-info {
            margin-top: 24px;
            padding: 16px;
            background: #f6f7f9;
            border: 1px solid #e8e8e8;
            border-radius: var(--ant-border-radius);
        }

        .debug-info h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--ant-text-color);
            margin: 0 0 12px;
        }

        .debug-info pre {
            margin: 0;
            padding: 12px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Courier New', monospace;
            font-size: 12px;
            color: var(--ant-text-color);
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            .auth-container {
                padding: 32px 20px;
                max-width: 100%;
                margin: 0;
            }
            
            .auth-header h1 {
                font-size: 22px;
            }
            
            .auth-logo {
                width: 56px;
                height: 56px;
                margin-bottom: 12px;
            }
            
            .auth-logo i {
                font-size: 24px;
            }
            
            .device-info {
                padding: 12px;
                margin-bottom: 20px;
            }
            
            .form-group {
                margin-bottom: 16px;
            }
            
            .ant-input {
                height: 44px; /* 移动设备上更大的触摸目标 */
                font-size: 16px; /* 防止iOS缩放 */
                padding: 10px 12px 10px 45px; /* 调整移动设备上的内边距，与桌面版保持一致 */
            }
            
            .ant-btn {
                height: 48px; /* 移动设备上更大的按钮 */
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 24px 16px;
            }
            
            .auth-header h1 {
                font-size: 20px;
            }
            
            .auth-header p {
                font-size: 13px;
            }
            
            .device-info-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 6px 0;
            }
            
            .device-info-value {
                margin-top: 4px;
                font-size: 13px;
            }
        }

        /* 大屏幕优化 */
        @media (min-width: 1200px) {
            .auth-container {
                max-width: 480px;
                padding: 56px 48px;
            }
            
            .auth-header h1 {
                font-size: 28px;
            }
            
            .auth-logo {
                width: 72px;
                height: 72px;
                margin-bottom: 20px;
            }
            
            .auth-logo i {
                font-size: 32px;
            }
        }

        /* 横屏手机适配 */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 8px;
            }
            
            .auth-container {
                padding: 20px;
                max-height: 90vh;
                overflow-y: auto;
            }
            
            .auth-header {
                margin-bottom: 16px;
            }
            
            .auth-logo {
                width: 48px;
                height: 48px;
                margin-bottom: 8px;
            }
            
            .device-info {
                margin-bottom: 16px;
                padding: 12px;
            }
        }

        /* 动画效果 */
        .auth-container {
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            animation: fadeIn 0.6s ease-out;
            animation-fill-mode: backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            /* padding: 12px; */
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group.optional {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .form-group.optional h4 {
            color: #555;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 15px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .device-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .device-info h4 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .device-info p {
            color: #555;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="tech-overlay"></div>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-wifi"></i>
            </div>
            <h1>网络认证</h1>
            <p>请填写设备信息以访问互联网</p>
        </div>

        <div class="device-info" id="deviceInfo">
            <h4><i class="fas fa-laptop"></i>设备信息</h4>
            <div class="device-info-item">
                <span class="device-info-label">内网 IP</span>
                <span class="device-info-value" id="userIP">获取中...</span>
            </div>
            <div class="device-info-item">
                <span class="device-info-label">公网 IP</span>
                <span class="device-info-value" id="publicIP">查询中...</span>
            </div>
            <div class="device-info-item">
                <span class="device-info-label">MAC 地址</span>
                <span class="device-info-value" id="userMAC">获取中...</span>
            </div>
        </div>

        <form id="authForm">
            <!-- 设备认证信息（主要字段） -->
            <div class="form-row" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 150px;">
                    <label for="deviceNumber">设备编号</label>
                    <div class="ant-input-prefix">
                        <i class="fas fa-hashtag"></i>
                        <input type="text" id="deviceNumber" name="deviceNumber" class="ant-input" required placeholder="请输入设备编号">
                    </div>
                </div>
                <div class="form-group" style="flex: 1; min-width: 150px;">
                    <label for="vpnNumber">VPN线路编号</label>
                    <div class="ant-input-prefix">
                        <i class="fas fa-network-wired"></i>
                        <input type="text" id="vpnNumber" name="vpnNumber" class="ant-input" required placeholder="请输入VPN线路">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">使用人手机号/姓名</label>
                <div class="ant-input-prefix">
                    <i class="fas fa-user"></i>
                    <input type="text" id="phone" name="phone" class="ant-input" required placeholder="请输入手机号或姓名">
                </div>
            </div>

            <!-- 用户名密码（可选，用于传统认证） -->
            <!-- 临时隐藏用户名密码输入框
            <div class="form-group optional" style="background: rgba(250, 250, 250, 0.6); padding: 15px; border-radius: 8px; margin-top: 20px;">
                <h4 style="color: #888; margin-bottom: 15px; font-size: 13px; font-weight: 400;">
                    <i class="fas fa-user-lock" style="margin-right: 6px; color: var(--ant-text-color-secondary);"></i>
                    可选信息（传统账户认证）
                </h4>
                <div class="form-group" style="margin-bottom: 10px; background: transparent;">
                    <label for="username" style="font-size: 13px; color: #888;">用户名（可选）</label>
                    <div class="ant-input-prefix">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" class="ant-input" placeholder="可不填">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 0; background: transparent;">
                    <label for="password" style="font-size: 13px; color: #888;">密码（可选）</label>
                    <div class="ant-input-prefix">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" class="ant-input" placeholder="可不填">
                    </div>
                </div>
            </div>
            -->

            <button type="submit" class="ant-btn ant-btn-primary" id="submitBtn">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>
                连接网络
            </button>
        </form>

        <div class="loading-spinner" id="loading">
            <div class="ant-spin"></div>
            <div class="loading-text">正在认证中，请稍候...</div>
        </div>

        <div id="message"></div>

        <!-- 调试信息显示区域 -->
        <div id="debugInfo" class="debug-info" style="display: none;">
            <h3>🔍 调试信息</h3>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <!-- MD5 加密库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
