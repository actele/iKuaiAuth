<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航页 - 快速访问</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 32px 40px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInDown 0.6s ease-out;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            color: #262626;
            font-size: 24px;
            margin: 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #1890ff;
        }

        .header-subtitle {
            color: #8c8c8c;
            font-size: 14px;
            margin-top: 4px;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .datetime-display {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .time-display {
            font-size: 48px;
            font-weight: 300;
            color: rgba(0, 0, 0, 0.65);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 1px;
            line-height: 1;
        }

        .date-display {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .date-main {
            font-size: 16px;
            color: rgba(0, 0, 0, 0.65);
            font-weight: 400;
        }

        .date-week {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.45);
            font-weight: 400;
        }

        .greeting {
            color: #1890ff;
            font-size: 14px;
            margin-top: 12px;
            font-weight: 400;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.02);
            animation: fadeInUp 0.6s ease-out 0.1s both;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-title {
            font-size: 16px;
            color: #262626;
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-title i {
            color: #1890ff;
        }

        .search-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-tab {
            padding: 8px 20px;
            border: 1px solid rgba(0, 0, 0, 0.09);
            background: #fafafa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            color: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
        }

        .search-tab:hover {
            background: #f0f5ff;
            border-color: #40a9ff;
            color: #40a9ff;
            transform: translateY(-1px);
        }

        .search-tab.active {
            background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.25);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.09);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            line-height: 1.5;
            background: #fafafa;
        }

        .search-input:hover {
            border-color: #40a9ff;
            background: white;
        }

        .search-input:focus {
            border-color: #1890ff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.12);
            background: white;
        }

        .search-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.5;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.2);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .links-section {
            background: white;
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.02);
            animation: fadeInUp 0.6s ease-out 0.2s both;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .section-title {
            font-size: 16px;
            color: #262626;
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: #1890ff;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .link-card {
            background: #fafafa;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 12px;
            padding: 18px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-card:hover {
            background: white;
            border-color: #1890ff;
            box-shadow: 0 4px 16px rgba(24, 144, 255, 0.15);
            transform: translateY(-2px);
        }

        .link-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .link-info {
            flex: 1;
            min-width: 0;
        }

        .link-name {
            font-size: 15px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.85);
            margin-bottom: 4px;
        }

        .link-desc {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.45);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            text-align: center;
            color: rgba(0, 0, 0, 0.45);
            font-size: 14px;
            margin-top: 24px;
            padding: 24px 0;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 暗黑模式样式 */
        body.dark-mode {
            background: #0a0a0a;
        }

        body.dark-mode .header,
        body.dark-mode .search-section,
        body.dark-mode .links-section {
            background: linear-gradient(145deg, #1a1a1a 0%, #1f1f1f 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode h1,
        body.dark-mode .search-title,
        body.dark-mode .section-title {
            color: rgba(255, 255, 255, 0.95);
        }

        body.dark-mode .time-display {
            color: rgba(255, 255, 255, 0.75);
        }

        body.dark-mode .date-main {
            color: rgba(255, 255, 255, 0.65);
        }

        body.dark-mode .header-subtitle,
        body.dark-mode .date-week {
            color: rgba(255, 255, 255, 0.45);
        }

        body.dark-mode .link-name {
            color: rgba(255, 255, 255, 0.85);
        }

        body.dark-mode .link-desc,
        body.dark-mode .footer {
            color: rgba(255, 255, 255, 0.35);
        }

        body.dark-mode .search-tab {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.75);
        }

        body.dark-mode .search-tab:hover {
            background: rgba(24, 144, 255, 0.15);
            border-color: #40a9ff;
            color: #40a9ff;
        }

        body.dark-mode .search-tab.active {
            background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%);
            color: white;
            border-color: transparent;
        }

        body.dark-mode .search-input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
        }

        body.dark-mode .search-input:hover,
        body.dark-mode .search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #40a9ff;
        }

        body.dark-mode .link-card {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .link-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #1890ff;
        }

        /* 暗黑模式切换按钮 */
        .theme-toggle {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 56px;
            height: 56px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: rgba(0, 0, 0, 0.65);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        body.dark-mode .theme-toggle {
            background: #1f1f1f;
            border-color: #434343;
            color: rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        }

        .theme-toggle:hover {
            color: #1890ff;
            border-color: #1890ff;
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px rgba(24, 144, 255, 0.3);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 16px;
            }

            .header-right {
                align-items: flex-start;
                width: 100%;
            }

            .datetime-display {
                width: 100%;
                justify-content: space-between;
            }

            .time-display {
                font-size: 24px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-btn {
                justify-content: center;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }

            .theme-toggle {
                bottom: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        /* 搜索引擎图标颜色 */
        .icon-baidu { background: linear-gradient(135deg, #2932E1 0%, #3C50F5 100%); color: white; }
        .icon-bing { background: linear-gradient(135deg, #008373 0%, #00A884 100%); color: white; }
        .icon-google { background: linear-gradient(135deg, #4285F4 0%, #34A853 100%); color: white; }
        
        /* AI大模型图标颜色 */
        .icon-chatgpt { background: linear-gradient(135deg, #10A37F 0%, #1A7F64 100%); color: white; }
        .icon-wenxin { background: linear-gradient(135deg, #4E6EF2 0%, #3855E0 100%); color: white; }
        .icon-tongyi { background: linear-gradient(135deg, #FF6A00 0%, #FF8533 100%); color: white; }
        .icon-kimi { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); color: white; }
        .icon-doubao { background: linear-gradient(135deg, #00D6CA 0%, #00B8AC 100%); color: white; }
        .icon-deepseek { background: linear-gradient(135deg, #1E293B 0%, #334155 100%); color: white; }
        .icon-zhipu { background: linear-gradient(135deg, #2563EB 0%, #1E40AF 100%); color: white; }
        .icon-tiangong { background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%); color: white; }
    </style>
</head>
<body>
    <!-- 暗黑模式切换按钮 -->
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <div>
                    <h1><i class="fas fa-compass"></i> 快速导航</h1>
                    <div class="header-subtitle">搜索引擎 & AI 大模型</div>
                </div>
            </div>
            <div class="header-right">
                <div class="datetime-display">
                    <div class="time-display" id="currentTime">00:00:00</div>
                    <div class="date-display">
                        <div class="date-main" id="currentDate">2025年11月3日</div>
                        <div class="date-week" id="currentWeek">星期日</div>
                    </div>
                </div>
                <div class="greeting" id="greeting">早上好！</div>
            </div>
        </div>

        <!-- 搜索区域 -->
        <div class="search-section">
            <div class="search-title">
                <i class="fas fa-search"></i>
                智能搜索
            </div>
            <div class="search-tabs">
                <div class="search-tab active" data-engine="baidu">
                    <i class="fas fa-paw"></i> 百度
                </div>
                <div class="search-tab" data-engine="bing">
                    <i class="fab fa-microsoft"></i> 必应
                </div>
                <div class="search-tab" data-engine="google">
                    <i class="fab fa-google"></i> 谷歌
                </div>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索..." onkeypress="handleEnter(event)">
                <button class="search-btn" onclick="performSearch()">
                    <i class="fas fa-search"></i>
                    搜索
                </button>
            </div>
        </div>

        <!-- 搜索引擎链接 -->
        <div class="links-section">
            <div class="section-title">
                <i class="fas fa-globe"></i>
                搜索引擎
            </div>
            <div class="links-grid">
                <a href="https://www.baidu.com" target="_blank" class="link-card">
                    <div class="link-icon icon-baidu">
                        <i class="fas fa-paw"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">百度</div>
                        <div class="link-desc">www.baidu.com</div>
                    </div>
                </a>
                <a href="https://cn.bing.com" target="_blank" class="link-card">
                    <div class="link-icon icon-bing">
                        <i class="fab fa-microsoft"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">必应</div>
                        <div class="link-desc">cn.bing.com</div>
                    </div>
                </a>
                <a href="https://www.google.com" target="_blank" class="link-card">
                    <div class="link-icon icon-google">
                        <i class="fab fa-google"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">谷歌</div>
                        <div class="link-desc">www.google.com</div>
                    </div>
                </a>
            </div>
        </div>

        <!-- AI大模型链接 -->
        <div class="links-section">
            <div class="section-title">
                <i class="fas fa-robot"></i>
                AI 大模型
            </div>
            <div class="links-grid">
                <a href="https://chatgpt.com" target="_blank" class="link-card">
                    <div class="link-icon icon-chatgpt">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">ChatGPT</div>
                        <div class="link-desc">OpenAI 聊天机器人</div>
                    </div>
                </a>
                <a href="https://yiyan.baidu.com" target="_blank" class="link-card">
                    <div class="link-icon icon-wenxin">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">文心一言</div>
                        <div class="link-desc">百度 AI 助手</div>
                    </div>
                </a>
                <a href="https://tongyi.aliyun.com" target="_blank" class="link-card">
                    <div class="link-icon icon-tongyi">
                        <i class="fas fa-fire"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">通义千问</div>
                        <div class="link-desc">阿里云大模型</div>
                    </div>
                </a>
                <a href="https://kimi.moonshot.cn" target="_blank" class="link-card">
                    <div class="link-icon icon-kimi">
                        <i class="fas fa-moon"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">Kimi</div>
                        <div class="link-desc">月之暗面 AI</div>
                    </div>
                </a>
                <a href="https://www.doubao.com" target="_blank" class="link-card">
                    <div class="link-icon icon-doubao">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">豆包</div>
                        <div class="link-desc">字节跳动 AI</div>
                    </div>
                </a>
                <a href="https://chat.deepseek.com" target="_blank" class="link-card">
                    <div class="link-icon icon-deepseek">
                        <i class="fas fa-search-plus"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">DeepSeek</div>
                        <div class="link-desc">深度求索</div>
                    </div>
                </a>
                <a href="https://chatglm.cn" target="_blank" class="link-card">
                    <div class="link-icon icon-zhipu">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">智谱清言</div>
                        <div class="link-desc">清华智谱 AI</div>
                    </div>
                </a>
                <a href="https://tiangong.kunlun.com" target="_blank" class="link-card">
                    <div class="link-icon icon-tiangong">
                        <i class="fas fa-cloud"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">天工 AI</div>
                        <div class="link-desc">昆仑万维</div>
                    </div>
                </a>
            </div>
        </div>

        <div class="footer">
            <p>Powered by iKuai Auth System</p>
        </div>
    </div>

    <script>
        // 当前选中的搜索引擎
        let currentEngine = 'baidu';

        // 搜索引擎配置
        const searchEngines = {
            baidu: 'https://www.baidu.com/s?wd=',
            bing: 'https://cn.bing.com/search?q=',
            google: 'https://www.google.com/search?q='
        };

        // 切换搜索引擎
        document.querySelectorAll('.search-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除所有active类
                document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
                // 添加active类到当前标签
                this.classList.add('active');
                // 更新当前搜索引擎
                currentEngine = this.getAttribute('data-engine');
            });
        });

        // 执行搜索
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (keyword) {
                const searchUrl = searchEngines[currentEngine] + encodeURIComponent(keyword);
                window.open(searchUrl, '_blank');
            } else {
                // 如果没有输入关键词，直接打开搜索引擎主页
                const homepages = {
                    baidu: 'https://www.baidu.com',
                    bing: 'https://cn.bing.com',
                    google: 'https://www.google.com'
                };
                window.open(homepages[currentEngine], '_blank');
            }
        }

        // 切换暗黑模式
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                themeIcon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';
            } else {
                themeIcon.className = 'fas fa-moon';
            }
        }

        // 处理回车键
        function handleEnter(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        // 更新时间显示
        function updateDateTime() {
            const now = new Date();
            
            // 更新时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
            
            // 更新日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            document.getElementById('currentDate').textContent = `${year}年${month}月${date}日`;
            
            // 更新星期
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('currentWeek').textContent = weekDays[now.getDay()];
            
            // 更新问候语
            const hour = now.getHours();
            let greeting = '';
            if (hour >= 6 && hour < 9) {
                greeting = '早上好！';
            } else if (hour >= 9 && hour < 12) {
                greeting = '上午好！';
            } else if (hour >= 12 && hour < 14) {
                greeting = '中午好！';
            } else if (hour >= 14 && hour < 18) {
                greeting = '下午好！';
            } else if (hour >= 18 && hour < 22) {
                greeting = '晚上好！';
            } else {
                greeting = '夜深了，注意休息！';
            }
            document.getElementById('greeting').textContent = greeting;
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化主题
            initTheme();
            // 立即更新一次时间
            updateDateTime();
            // 每秒更新时间
            setInterval(updateDateTime, 1000);
            // 聚焦搜索框
            document.getElementById('searchInput').focus();
        });
    </script>
</body>
</html>
